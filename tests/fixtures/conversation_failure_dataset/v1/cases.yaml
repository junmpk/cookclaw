schema_version: conversation_failure_dataset_v1
dataset_version: 2026.08.1
cases:
  - case_id: CTX-01
    title: 候选序号后继续用单数指代
    source: 2026-08-05 Web 验收与本轮代码审计
    severity: P0
    tags: [context, reference, recipe_detail]
    channel: web
    locale: zh
    thread_policy: reuse
    pre_state: {kind: fresh}
    turns:
      - input: 推荐三道鸡肉菜
        expected:
          route: [recipe_search, recipe_recommend]
          state: {candidate_count_min: 1, pending_action: select_recipe}
          allowed_tools: [recipe_search]
          forbidden_tools: [device_start, device_stop]
          response: {nonempty: true, must_not_contain: [候选池, 数据库], max_questions: 1}
          judge_rubric: {context_continuity: 4, naturalness: 4, groundedness: 5}
      - input: 第二个
        expected:
          route: [candidate_selection]
          reference: "latest_candidates[1]"
          state: {selected_recipe: "latest_candidates[1]"}
          allowed_tools: []
          forbidden_tools: [recipe_search, device_start]
          response: {nonempty: true, must_not_contain: [重新搜索], max_questions: 1}
          judge_rubric: {context_continuity: 5, naturalness: 4, groundedness: 5}
      - input: 这个怎么做
        expected:
          route: [recipe_detail]
          reference: selected_recipe
          state: {selected_recipe: unchanged}
          allowed_tools: [recipe_detail]
          forbidden_tools: [recipe_search, device_start]
          response: {nonempty: true, must_not_contain: [食谱ID, 猜测], max_questions: 1}
          judge_rubric: {context_continuity: 5, naturalness: 4, groundedness: 5}
    cleanup: {reset_session: true}

  - case_id: CTX-02
